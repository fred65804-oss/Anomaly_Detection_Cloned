══════════════════════════════════════════════════════════════════════
                    HYBRID IDS ARCHITECTURE FLOW
══════════════════════════════════════════════════════════════════════

┌─────────────────────────────────────────────────────────────────────┐
│                        1. TRAINING PATH                              │
└─────────────────────────────────────────────────────────────────────┘

ENTRY POINT: training/train.py
├── [DATA LOADING]
│   ├── Files: training/KDDTrain.csv OR any CSV
│   │         training/KDDTest.csv
│   ├── Label Detection: Auto-detects from ['attack_class', 'label', 
│   │                   'class', 'target', 'attack', 'intrusion']
│   └── Output: X_train, y_train, X_val, y_val, X_test, y_test
│
├── [PIPELINE INITIALIZATION]
│   ├── File: pipeline/config.py
│   │   └── IDSConfig: All hyperparameters
│   │       ├── supervised_weight = 0.10 (OPTIMAL - tested)
│   │       ├── default_threshold = 0.50 (OPTIMAL - tested)
│   │       ├── optimize_weights = False (use manual optimal values)
│   │       ├── use_autoencoder = True
│   │       ├── ae_encoding_dim = 32
│   │       ├── anomaly_detectors = ['isolation_forest', 'lof']
│   │       └── ensemble_method = 'max'
│   │
│   └── File: pipeline/pipeline.py
│       └── HybridIDSPipeline(config)
│
├── [PIPELINE.FIT() - 10 STEPS]
│   │
│   ├── Step 1: PREPROCESSING
│   │   ├── File: pipeline/preprocessing.py
│   │   ├── Class: Preprocessor (DYNAMIC - dataset-agnostic)
│   │   ├── Features: Auto-detects categorical columns
│   │   │            (KDD: protocol_type, service, flag)
│   │   ├── Input: Raw 41 KDD features OR any dataset
│   │   └── Output: Encoded categorical, processed 107 features
│   │
│   ├── Step 2: FEATURE ENGINEERING
│   │   ├── File: pipeline/feature_engineering.py
│   │   ├── Functions: add_statistical_features() (CONDITIONAL)
│   │   │             add_context_aware_features() (CONDITIONAL)
│   │   ├── Note: Network-specific features only added if columns exist
│   │   ├── Input: 107 features
│   │   └── Output: 119 features (added 12 network features for KDD)
│   │
│   ├── Step 3: DROP CORRELATED FEATURES
│   │   ├── File: pipeline/feature_engineering.py
│   │   ├── Function: drop_correlated_features()
│   │   ├── Threshold: 0.95 correlation
│   │   ├── Input: 119 features
│   │   └── Output: ~107 features (removes highly correlated)
│   │
│   ├── Step 4: SCALING
│   │   ├── Uses: sklearn StandardScaler/RobustScaler
│   │   ├── Input: 107 features
│   │   ├── Output: X_train_scaled (normalized)
│   │   └── Filter: X_normal_train (only normal traffic, y==0)
│   │
│   ├── Step 5: AUTOENCODER TRAINING
│   │   ├── File: pipeline/autoencoder.py
│   │   ├── Class: AutoencoderIDS
│   │   ├── Architecture: 107 → 128 → 64 → 32 → 64 → 128 → 107
│   │   ├── Training Data: X_normal_train ONLY (unsupervised)
│   │   ├── Epochs: 50, Batch: 256
│   │   ├── Output: Trained encoder + decoder
│   │   └── Purpose: (a) Reconstruction error for anomaly detection
│   │               (b) 32-dim encoded features for RF
│   │
│   ├── Step 6: PCA (Optional, currently enabled)
│   │   ├── Uses: sklearn PCA
│   │   ├── Input: X_normal_train (107 features)
│   │   ├── Output: 2-3 principal components
│   │   └── Purpose: Dimensionality reduction for visualization
│   │
│   ├── Step 7: ANOMALY DETECTORS
│   │   ├── File: pipeline/anomaly_models.py
│   │   ├── Training Data: X_normal_train ONLY
│   │   │
│   │   ├── [Isolation Forest]
│   │   │   ├── Class: IsolationForestDetector
│   │   │   ├── n_estimators: 100
│   │   │   ├── contamination: 0.30
│   │   │   └── Output: Anomaly scores [0-1]
│   │   │
│   │   └── [Local Outlier Factor]
│   │       ├── Class: LocalOutlierFactorDetector
│   │       ├── n_neighbors: 20
│   │       ├── contamination: 0.30
│   │       └── Output: Anomaly scores [0-1]
│   │
│   ├── Step 8: SUPERVISED MODEL (Random Forest)
│   │   ├── File: pipeline/supervised.py
│   │   ├── Class: SupervisedRF
│   │   ├── Input: X_train_encoded (32 features from autoencoder)
│   │   │         OR X_train_scaled if AE disabled
│   │   ├── Training: ALL samples (normal + attack) with labels
│   │   ├── n_estimators: 100
│   │   ├── class_weight: 'balanced'
│   │   └── Output: Attack probability [0-1]
│   │
│   ├── Step 9: OPTIMIZE WEIGHTS & THRESHOLD (or use defaults)
│   │   ├── File: pipeline/ensemble.py, pipeline/threshold.py
│   │   ├── If optimize_weights=True:
│   │   │   ├── Function: optimize_supervised_weight()
│   │   │   ├── Search Space: weights [0.0-1.0], thresholds [0.2-0.8]
│   │   │   ├── Optimization: F1 score with min_recall >= 0.90
│   │   │   └── Output: optimal_weight, optimal_threshold
│   │   ├── If optimize_weights=False:
│   │   │   └── Use default_threshold and supervised_weight from config
│   │   └── File: pipeline/normalization.py
│   │       └── ScoreNormalizer: ALWAYS fitted (on validation or train data)
│   │
│   └── Step 10: CREATE ENSEMBLE
│       ├── File: pipeline/ensemble.py
│       ├── Class: HybridEnsemble
│       ├── Method: MAX (Hard Maximum)
│       ├── Formula: max(supervised_weight * RF_prob,
│       │                (1 - supervised_weight) * max(unsupervised_scores))
│       └── Output: Final anomaly score [0-1]
│
└── [MODEL SAVING]
    ├── File: utils/model_manager.py
    ├── Class: ModelManager
    ├── Destination: artifacts/latest/
    └── Saved Files (11 total):
        ├── config.json                    # Configuration
        ├── params.joblib                  # Feature names, threshold
        ├── preprocessor.joblib            # DataPreprocessor
        ├── scaler.joblib                  # StandardScaler
        ├── pca.joblib                     # PCA (optional)
        ├── autoencoder.weights.h5         # AE weights (TensorFlow)
        ├── anomaly_detectors.joblib       # IF + LOF dict
        ├── supervised_model.joblib        # Random Forest
        ├── normalizer.joblib              # ScoreNormalizer
        ├── ensemble.joblib                # HybridEnsemble
        └── threshold_optimizer.joblib     # ThresholdOptimizer


┌─────────────────────────────────────────────────────────────────────┐
│                        2. INFERENCE PATH (API)                       │
└─────────────────────────────────────────────────────────────────────┘

ENTRY POINT: app/main.py (FastAPI)
├── [STARTUP]
│   ├── File: app/dependencies.py
│   ├── Function: get_pipeline()
│   ├── Uses: ModelManager("artifacts").load_pipeline("latest")
│   └── Loads: All 11 model files from artifacts/latest/
│
├── [API ENDPOINTS]
│   ├── POST /predict (single prediction)
│   │   ├── Schema: app/schemas.py → NetworkTrafficInput
│   │   │   └── Input: 41 KDD features as JSON
│   │   │
│   │   └── Pipeline.predict_proba(X):
│   │       ├── Step 1: Preprocess (DataPreprocessor)
│   │       ├── Step 2: Feature engineering
│   │       ├── Step 3: Drop correlated features
│   │       ├── Step 4: Scale (StandardScaler)
│   │       ├── Step 5: Encode (Autoencoder) → 32 features
│   │       ├── Step 6: Get scores:
│   │       │   ├── Autoencoder: reconstruction error
│   │       │   ├── Isolation Forest: anomaly score
│   │       │   ├── LOF: anomaly score
│   │       │   └── Random Forest: attack probability (on encoded)
│   │       ├── Step 7: Normalize scores (ScoreNormalizer)
│   │       ├── Step 8: Ensemble (HybridEnsemble - MAX)
│   │       │   └── max(0.10 * RF_prob, 0.90 * max(AE, IF, LOF))
│   │       ├── Step 9: Threshold (0.50)
│   │       │   └── prediction = 'intrusion' if score > 0.50 else 'normal'
│   │       │
│   │       └── Output: PredictionOutput
│   │           ├── prediction: 'normal' or 'intrusion'
│   │           ├── confidence: score [0-1]
│   │           ├── alert_level: CRITICAL/HIGH/MEDIUM/LOW/NORMAL
│   │           └── alert_message: Human-readable message
│   │
│   ├── POST /predict/batch (batch predictions)
│   │   └── Same as above, processes list of samples
│   │
│   ├── GET /health
│   │   └── Returns: Pipeline loaded status
│   │
│   └── GET /model/info
│       └── Returns: threshold, supervised_weight, config
│
└── [TESTING]
    ├── File: test_api.py
    ├── Data: test_samples.json (85 realistic KDD samples)
    ├── Calls: All API endpoints
    └── Output: test_results.json (accuracy, per-sample results)


┌─────────────────────────────────────────────────────────────────────┐
│                        3. KEY DATA FLOWS                             │
└─────────────────────────────────────────────────────────────────────┘

[TRAINING DATA FLOW]
KDDTrain.csv (125,973 samples)
    ↓ [pandas read_csv]
Raw 41 features
    ↓ [DataPreprocessor: encode categoricals]
107 processed features
    ↓ [Feature Engineering: +12 features]
119 features
    ↓ [Drop correlated: threshold 0.95]
~107 features
    ↓ [StandardScaler]
Scaled features
    ↓ [Split: normal vs attack]
    ├─→ Normal only → Autoencoder, IF, LOF (unsupervised)
    └─→ All samples → Random Forest (supervised)
    ↓ [Autoencoder encode()]
32 encoded features → Random Forest training
    ↓ [Validation: fit normalizer + use manual config]
Final: threshold=0.50, weight=0.10 (manually optimized)


[INFERENCE DATA FLOW]
Single network connection (41 features)
    ↓ [FastAPI: NetworkTrafficInput schema]
Validated JSON
    ↓ [Convert to pandas DataFrame]
1-row DataFrame
    ↓ [pipeline._transform_features()]
    ├─→ Preprocess (107 features)
    ├─→ Feature engineering (119 features)
    ├─→ Drop correlated (~107 features)
    └─→ Scale (normalized)
    ↓ [pipeline.predict_proba()]
    ├─→ Autoencoder: reconstruction error score
    ├─→ Isolation Forest: anomaly score
    ├─→ LOF: anomaly score
    ├─→ Random Forest: attack probability (on 32 encoded)
    ↓ [Normalize all scores 0-1]
    ↓ [Ensemble MAX]
Final score [0-1]
    ↓ [Compare to threshold 0.50]
    ├─→ > 0.50 → 'intrusion'
    └─→ ≤ 0.50 → 'normal'
    ↓ [determine_alert_level()]
Alert: CRITICAL/HIGH/MEDIUM/LOW/NORMAL
    ↓ [PredictionOutput schema]
JSON response to client


